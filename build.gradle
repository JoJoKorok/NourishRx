plugins {
    id "com.android.application" version "9.2.0" apply false
}

def isolatedBuildRoot = providers.gradleProperty("nourishrx.isolatedBuildRoot").orNull

if (isolatedBuildRoot) {
    layout.buildDirectory.set(file("${isolatedBuildRoot}/root"))
    subprojects {
        layout.buildDirectory.set(file("${isolatedBuildRoot}/${project.name}"))
    }
}
