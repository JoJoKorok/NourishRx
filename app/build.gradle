plugins {
    id "com.android.application"
}

android {
    namespace "com.jojokorok.nourishrx"
    compileSdk 37

    defaultConfig {
        applicationId "com.jojokorok.nourishrx"
        minSdk 26
        targetSdk 37
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "com.google.mlkit:barcode-scanning:17.3.0"
}
